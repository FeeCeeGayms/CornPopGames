// Android Studio / Gradle build. The web game is copied into assets first by
// build-apk.sh (or run: ./build-apk.sh once, then build here).
plugins { id 'com.android.application' }

android {
    namespace 'com.cornkart.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.cornkart.game'
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName '19.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    androidResources { noCompress += ['js'] }
}
